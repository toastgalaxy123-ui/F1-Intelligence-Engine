[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-race-intelligence"
version = "0.1.0"
description = "Reproducible Formula 1 race-intelligence research system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "duckdb>=1.2,<2.0",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
modeling = ["scikit-learn>=1.5,<2", "statsmodels>=0.14,<1", "matplotlib>=3.8,<4"]
dashboard = ["streamlit>=1.40,<2", "plotly>=5.20,<7"]

[project.scripts]
f1ri = "f1ri.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
